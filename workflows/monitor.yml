name: Continuous CPU & IP Monitor (5h 55m)

on:
  workflow_dispatch:
    inputs:
      interval_seconds:
        description: 'Interval pengecekan (detik)'
        required: false
        default: '60'
      duration_minutes:
        description: 'Durasi berjalan (menit) - max 355 (5 jam 55 mnt)'
        required: false
        default: '355'

jobs:
  monitor:
    name: Run Monitor Loop
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Batas maksimal GitHub Actions (6 jam)

    steps:
      - name: Checkout repository (opsional)
        uses: actions/checkout@v4

      - name: Jalankan Loop Monitor CPU & IP
        run: |
          set -e

          INTERVAL="${{ github.event.inputs.interval_seconds || 60 }}"
          DURATION_MINUTES="${{ github.event.inputs.duration_minutes || 355 }}"
          
          # Konversi durasi ke detik
          TARGET_SECONDS=$((DURATION_MINUTES * 60))
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + TARGET_SECONDS))

          echo "=========================================================="
          echo "🚀 Monitoring dimulai: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️  Durasi target    : $DURATION_MINUTES menit ($TARGET_SECONDS detik)"
          echo "⏳ Interval check   : setiap $INTERVAL detik"
          echo "🎯 Selesai pada     : $(date -u -d @$END_TIME '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================================="

          # Tangkap sinyal pembatalan manual (Cancel run di GitHub UI)
          trap 'echo -e "\n🛑 [$(date -u "+%Y-%m-%d %H:%M:%S UTC")] Workflow dihentikan / di-cancel secara manual."; exit 0' SIGINT SIGTERM

          ITERATION=1
          while [ $(date +%s) -lt $END_TIME ]; do
            CURRENT_TIME=$(date +%s)
            REMAINING=$((END_TIME - CURRENT_TIME))
            REMAINING_MIN=$((REMAINING / 60))
            REMAINING_SEC=$((REMAINING % 60))

            echo ""
            echo "----------------------------------------------------------"
            echo "📌 [Iterasi #$ITERATION] $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "⏳ Sisa waktu: ${REMAINING_MIN} menit ${REMAINING_SEC} detik"
            
            # Cek IP Publik menggunakan icanhazip
            echo -n "🌐 Public IP (icanhazip): "
            IP=$(curl -s -m 10 https://icanhazip.com || echo "Timeout/Gagal")
            echo "$IP"

            # Cek Status CPU & Load Average
            echo "⚙️  CPU & Load Average:"
            uptime
            top -bn1 | head -n 5

            ITERATION=$((ITERATION + 1))

            # Tunggu interval berikutnya jika masih dalam batas waktu
            if [ $((CURRENT_TIME + INTERVAL)) -lt $END_TIME ]; then
              sleep $INTERVAL
            else
              REMAINING_FINAL=$((END_TIME - $(date +%s)))
              if [ $REMAINING_FINAL -gt 0 ]; then
                sleep $REMAINING_FINAL
              fi
              break
            fi
          done

          echo ""
          echo "=========================================================="
          echo "✅ Monitoring selesai setelah $DURATION_MINUTES menit."
          echo "🏁 Selesai pada: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================================="
